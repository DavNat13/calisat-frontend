# ============================================================================
# calisat-frontend — nginx (SPA estática + cabeceras de seguridad)
# ============================================================================
# NOTA DE HERENCIA DE nginx (clave para no perder las cabeceras):
#   "add_header se hereda del nivel superior SOLO si el nivel actual no
#    declara ningún add_header propio".
# Por eso la política de este archivo es:
#   * TODOS los add_header de seguridad viven únicamente en el bloque
#     `server` → así /, /productos, /assets/ y las imágenes los reciben.
#   * El control de caché se hace con `expires` (directiva independiente,
#     NO invalida la herencia de add_header). Si en algún momento hay que
#     usar add_header Cache-Control dentro de un location, hay que repetir
#     también TODAS las cabeceras de seguridad en ese location.
# ============================================================================
server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # No anunciar la versión de nginx (cabecera Server)
    server_tokens off;

    # ==========================================
    # Compresión Gzip
    # ==========================================
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml
        application/rss+xml
        image/svg+xml;

    # ==========================================
    # Cabeceras de seguridad (solo a nivel server)
    # ==========================================

    # CSP pragmática (sin nonce): el bundle de Vite no lleva scripts inline
    # ni eval, así que script-src queda en 'self' (nadie inyecta <script> en
    # index.html; si algún día hace falta uno inline, usar nonce y repetir TODAS
    # las cabeceras de este bloque en el location que lo sirva).
    #  - style-src con 'unsafe-inline': 'unsafe-inline' para ESTILOS es lo que
    #    exige la toolchain y los atributos style de terceros; NO se concede a
    #    script-src (ahí está la mitigación real contra XSS→RCE).
    #  - img-src incluye https: porque las fichas de producto cargan
    #    `imagenUrl` de dominios de terceros (data: para placeholders inline).
    #  - connect-src: verificados los hosts que la app USA realmente:
    #      * 'self'              → mismo origen (assets/SPA).
    #      * *.execute-api...    → API Gateway de datos (src/config/api.js:
    #                              ho5p58iyu7…). El comodín cubre también el
    #                              origen de redirección de MSAL (ezeh839whh…)
    #                              si la SPA acaba servida detrás de otro
    #                              API Gateway. (connect-src gobierna
    #                              fetch/XHR/WS, no la navegación de login.)
    #      * login.microsoftonline.com → autoridad MSAL (AuthConfig.js):
    #                              authorize / token / discovery (openid-configuration).
    #      * login.windows.net    → alias histórico de Entra ID que MSAL usa
    #                              en la comprobación de instancia (msal-common).
    #      NO se abre graph.microsoft.com (la app no llama a Graph) ni
    #      cognitoidentity.amazonaws.com (no se usa Cognito: la auth es Entra ID).
    #  - frame-ancestors 'none': la app no se embebe en NINGÚN sitio (no hay
    #    iframes propios) → clickjacking bloqueado de raíz.
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' https://*.execute-api.us-east-1.amazonaws.com https://login.microsoftonline.com https://login.windows.net;" always;

    # Anti-clickjacking para navegadores que no entienden frame-ancestors.
    # DENY (no SAMEORIGIN): la SPA nunca se muestra dentro de un iframe, ni
    # aunque sea el mismo dominio.
    add_header X-Frame-Options "DENY" always;

    # MIME sniffing → el navegador no "adivina" tipos (evita que un
    # archivo subido se ejecute como script)
    add_header X-Content-Type-Options "nosniff" always;

    # '0' desactiva el XSS filter obsoleto de IE/Chrome antiguos: protege
    # menos que estorba (recomendación de OWASP).
    add_header X-XSS-Protection "0" always;

    # No filtrar la URL de origen en peticiones cross-site
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # APIs del navegador que la app no usa (lista mínima razonable;
    # payment=() además corta la API de Payment Request, innecesaria aquí)
    add_header Permissions-Policy "accelerometer=(), camera=(), display-capture=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()" always;

    # Aislamiento de contexto de navegación: impide que otra pestaña/opener
    # (p. ej. un enlace malicioso que nos abra y quiera leer window.opener)
    # comparta grupo de browsing context con la SPA. No afecta al flujo de
    # redirect de MSAL (navegación de nivel superior, sin popups).
    add_header Cross-Origin-Opener-Policy "same-origin" always;

    # Nuestros JS/CSS/imágenes no pueden ser consumidos como subrecurso por
    # otros orígenes (protege el bundle frente a hotlink/inclusión cruzada).
    # No afecta a las imágenes de terceros que NUESTRA página carga (eso lo
    # decide el servidor de origen de cada imagen).
    add_header Cross-Origin-Resource-Policy "same-origin" always;

    # El PDF/Flash/... de terceros no debe heredar permisos de este origen
    add_header X-Permitted-Cross-Domain-Policies "none" always;

    # HSTS: solo lo aplica el navegador si la respuesta llega por HTTPS;
    # si el origen se sirve por HTTP plano, se ignora (sin efecto secundario).
    # Sin includeSubDomains/preload para no comprometer subdominios.
    # Requiere que el TLS termine en el proxy/ALB/CDN delante de este contenedor.
    add_header Strict-Transport-Security "max-age=31536000" always;

    # ==========================================
    # Rutas de la SPA (React Router) + index.html
    # ==========================================
    # expires -1  →  Cache-Control: no-cache (revalida con ETag en cada
    # visita): un despliegue nuevo se ve al instante en /, /productos, etc.
    location / {
        try_files $uri $uri/ /index.html;
        expires -1;
    }

    # ==========================================
    # Assets estáticos con caché larga
    # ==========================================
    # Los nombres llevan hash (index-XXXX.js) → inmutables de facto.
    # Se usa `expires` en lugar de `add_header Cache-Control` para no romper
    # la herencia de las cabeceras de seguridad del bloque server.
    # `^~` evita que la regex de imágenes de abajo (30d) gane sobre este
    # location y recorte la caché de los assets con hash a 30 días.
    location ^~ /assets/ {
        expires 1y;
    }

    # Favicon y otros estáticos
    location ~* \.(ico|svg|png|jpg|jpeg|gif|webp)$ {
        expires 30d;
    }

    # ==========================================
    # Bloquear acceso a archivos ocultos (.git, .env, .htaccess, ...)
    # ==========================================
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
